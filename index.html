<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kindlify</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="kindle.css">
</head>
<body>

<div id="app">

  <div id="artwork">
    <img id="albumArt" src="">
  </div>

  <div id="trackInfo">
    <div id="title">Not Connected</div>
    <div id="artist">—</div>
  </div>

  <div id="controls">
    <button onclick="previous()">⏮</button>
    <button onclick="togglePlay()">⏯</button>
    <button onclick="next()">⏭</button>
    <button onclick="shuffle()">🔀</button>
  </div>

</div>

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
